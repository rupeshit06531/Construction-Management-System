components:
  schemas:
    Attendance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        employee:
          type: integer
        employee_name:
          type: string
          readOnly: true
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/AttendanceStatusEnum'
        check_in:
          type: string
          format: time
          nullable: true
        check_out:
          type: string
          format: time
          nullable: true
        remarks:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - date
      - employee
      - employee_name
      - id
      - status
      - updated_at
    AttendanceRequest:
      type: object
      properties:
        employee:
          type: integer
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/AttendanceStatusEnum'
        check_in:
          type: string
          format: time
          nullable: true
        check_out:
          type: string
          format: time
          nullable: true
        remarks:
          type: string
          nullable: true
      required:
      - date
      - employee
      - status
    AttendanceStatusEnum:
      enum:
      - PRESENT
      - ABSENT
      - LEAVE
      type: string
      description: |-
        * `PRESENT` - Present
        * `ABSENT` - Absent
        * `LEAVE` - Leave
    DashboardKPI:
      type: object
      properties:
        total_projects:
          type: integer
        total_employees:
          type: integer
        total_tasks:
          type: integer
        total_materials:
          type: integer
        total_inventory_items:
          type: integer
        total_expenses:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
        total_payroll:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
      required:
      - total_employees
      - total_expenses
      - total_inventory_items
      - total_materials
      - total_payroll
      - total_projects
      - total_tasks
    Employee:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          nullable: true
          maxLength: 100
        employee_type:
          $ref: '#/components/schemas/EmployeeTypeEnum'
        phone:
          type: string
          maxLength: 15
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        joining_date:
          type: string
          format: date
        salary:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        address:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - employee_type
      - first_name
      - id
      - joining_date
      - phone
      - salary
      - updated_at
    EmployeeRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          nullable: true
          maxLength: 100
        employee_type:
          $ref: '#/components/schemas/EmployeeTypeEnum'
        phone:
          type: string
          minLength: 1
          maxLength: 15
        email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        joining_date:
          type: string
          format: date
        salary:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        address:
          type: string
          nullable: true
      required:
      - employee_type
      - first_name
      - joining_date
      - phone
      - salary
    EmployeeTypeEnum:
      enum:
      - ENGINEER
      - SUPERVISOR
      - WORKER
      type: string
      description: |-
        * `ENGINEER` - Engineer
        * `SUPERVISOR` - Supervisor
        * `WORKER` - Worker
    Expense:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: integer
        project_name:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 200
        category:
          $ref: '#/components/schemas/ExpenseCategoryEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        expense_date:
          type: string
          format: date
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
