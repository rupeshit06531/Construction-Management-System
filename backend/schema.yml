openapi: 3.0.3
info:
  title: Construction Management System API
  version: 1.0.0
  description: Enterprise Construction Management System API Documentation
paths:
  /api/accounts/login/:
    post:
      operationId: api_accounts_login_create
      description: Authenticate user using email and password and return JWT tokens.
      summary: User login
      tags:
      - Accounts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/accounts/me/:
    get:
      operationId: api_accounts_me_retrieve
      description: Returns authenticated user's information.
      summary: Get current user
      tags:
      - Accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounts/register/:
    post:
      operationId: api_accounts_register_create
      description: Create a new user account in the system.
      summary: Register new user
      tags:
      - Accounts
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/accounts/token/refresh/:
    post:
      operationId: api_accounts_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/attendance/:
    get:
      operationId: api_attendance_list
      description: |-
        GET: Retrieve attendance records with search, filtering and ordering.
        POST: Create a new attendance record.
      summary: List and create attendance records
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
      - in: query
        name: employee
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ABSENT
          - LEAVE
          - PRESENT
        description: |-
          * `PRESENT` - Present
          * `ABSENT` - Absent
          * `LEAVE` - Leave
      tags:
      - Attendance
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttendanceList'
          description: ''
    post:
      operationId: api_attendance_create
      description: |-
        GET: Retrieve attendance records with search, filtering and ordering.
        POST: Create a new attendance record.
      summary: List and create attendance records
      tags:
      - Attendance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttendanceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttendanceRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attendance'
          description: ''
  /api/attendance/{id}/:
    get:
